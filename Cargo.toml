# ──────────────────────────────────────────────────────────────────────
#  GENSLATE — Cargo workspace
#  Members are listed explicitly: `crates/*` would also match `crates/core`,
#  which is a grouping folder without a manifest; `crates/core/*` holds one
#  crate per app (`genslate-core-<app>`).
# ──────────────────────────────────────────────────────────────────────
[workspace]
resolver = "3"
members = [
    "crates/app-common",
    "crates/design-tokens",
    "crates/paths",
    "crates/storage",
    "crates/testing",
    "crates/core/*",
    "desktop/*/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["GENSLATE"]
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/ATOMANGELETTI/GENSLATE"

[workspace.dependencies]
# ── Internal crates ──────────────────────────────────────────────────
genslate-app-common = { path = "crates/app-common" }
genslate-design-tokens = { path = "crates/design-tokens" }
genslate-paths = { path = "crates/paths" }
genslate-storage = { path = "crates/storage" }
genslate-testing = { path = "crates/testing" }
genslate-core-aistudio = { path = "crates/core/aistudio" }
genslate-core-browser = { path = "crates/core/browser" }
genslate-core-coder = { path = "crates/core/coder" }
genslate-core-command = { path = "crates/core/command" }
genslate-core-editor = { path = "crates/core/editor" }
genslate-core-example = { path = "crates/core/example" }
genslate-core-explorer = { path = "crates/core/explorer" }
genslate-core-gallery = { path = "crates/core/gallery" }
genslate-core-jukebox = { path = "crates/core/jukebox" }
genslate-core-launcher = { path = "crates/core/launcher" }
genslate-core-terminal = { path = "crates/core/terminal" }
genslate-core-theater = { path = "crates/core/theater" }
genslate-core-toolbox = { path = "crates/core/toolbox" }

# ── Tauri (stable 2.x only) ──────────────────────────────────────────
tauri = { version = "2.11.6", default-features = false }
tauri-build = "2.6.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-log = "2.9.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-os = "2.3.2"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-window-state = "2.4.1"

# ── Core ─────────────────────────────────────────────────────────────
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
dunce = "1.0.5"
fast_image_resize = { version = "6.1.0", features = ["image"] }
filetime = "0.2.29"
getrandom = "0.4.3"
gix = { version = "0.88.0", default-features = false, features = ["sha1", "status"] }
globset = "0.4.20"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ico = "0.5.0"
ignore = "0.4.33"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "rayon", "tiff", "webp"] }
image_hasher = "3.1.1"
imagesize = "0.15.0"
jxl-oxide = { version = "0.12.6", features = ["image"] }
log = "0.4.34"
nom-exif = "3.8.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
nucleo-matcher = "0.3.1"
nvml-wrapper = "0.13.0"
pelite = "0.10.0"
portable-pty = "0.9.0"
rayon = "1.12.0"
reflink-copy = "0.1.30"
resvg = { version = "0.48.1", default-features = false }
reverse_geocoder = "4.1.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
rust-ini = "0.21.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39.6", default-features = false, features = ["component", "disk", "network", "system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trash = "5.2.9"
vte = "0.15.0"
which = "8.0.6"
winreg = "0.56.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
unwrap_used = "deny"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Pedantic lints that fight idiomatic Tauri / library code:
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow" # #[tauri::command] arguments must be owned

[workspace.metadata.cargo-machete]
ignored = []

# Profiles are only read from the workspace root.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
overflow-checks = true

[profile.dev.package."*"]
# Optimise dependencies (not our crates) so debug builds of Tauri apps stay snappy.
opt-level = 1
