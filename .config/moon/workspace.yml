# ──────────────────────────────────────────────────────────────────────
#  GENSLATE — moon workspace
#  https://moonrepo.dev/docs/config/workspace
#  Local schemas are generated by `moon sync config-schemas` (run by `bun run setup`).
# ──────────────────────────────────────────────────────────────────────
$schema: './cache/schemas/workspace.json'

versionConstraint: '>=2.5.5'
telemetry: false

projects:
  globs:
    - 'desktop/*/moon.yml'
    - 'packages/*/moon.yml'
    - 'webapp/*/moon.yml'
  sources:
    # The root project owns the Cargo workspace and repo-wide tasks (lint, spell, knip).
    root: '.'

vcs:
  client: 'git'
  provider: 'github'
  defaultBranch: 'main'
  remoteCandidates: ['origin', 'upstream']

pipeline:
  autoCleanCache: true
  cacheLifetime: '7 days'
  installDependencies: true
  syncProjects: true
  syncWorkspace: true
  inheritColorsForPipedTasks: true
  logRunningCommand: true

generator:
  templates: ['./.config/moon/templates']

constraints:
  enforceLayerRelationships: true
  # A project tagged <key> may only depend on projects carrying one of the listed tags.
  tagRelationships:
    ui: ['tokens', 'config']
    bridge: ['config']
    tokens: ['config']

hasher:
  optimization: 'accuracy'
  walkStrategy: 'vcs'
  warnOnMissingInputs: true

notifier:
  terminalNotifications: 'failure'
