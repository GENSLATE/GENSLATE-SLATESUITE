# ──────────────────────────────────────────────────────────────────────
#  GENSLATE — cargo-deny policy
#  Run: `moon run root:rust-deny`  (= cargo deny --config .config/cargo/deny.toml check)
#  Docs: https://embarkstudios.github.io/cargo-deny/checks/cfg.html
# ──────────────────────────────────────────────────────────────────────

[graph]
# Check every platform we ship installers for.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[output]
feature-depth = 1

# ── Security advisories (RustSec) ────────────────────────────────────
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Unmaintained / unsound crates in our own graph fail; transitive ones only warn.
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = [
    # glib's `VariantStrIter` (GVariant string-array iterator) has unsound out-argument passing;
    # fixed in glib >=0.20. It reaches us only transitively, through Tauri's Linux WebView stack
    # (tao -> gtk/webkit2gtk-rs -> glib 0.18), which we do not control and which pins glib ^0.18.
    # We never touch GVariant iteration ourselves. No compatible upgrade exists yet: `cargo update
    # -p glib` cannot move past 0.18.x while tauri 2.11.6 (the latest 2.x release) depends on the
    # 0.18-line gtk-rs crates. Re-check on every Tauri bump; drop this once wry/tao move to gtk-rs
    # >=0.19 or a 0.18.x point release backports the fix.
    { id = "RUSTSEC-2024-0429", reason = "unreachable from our code; no compatible fix in tauri 2.11.6's dependency tree" },
]

# ── Licenses ─────────────────────────────────────────────────────────
[licenses]
# Permissive licences compatible with shipping closed-source desktop binaries.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# The allow list is a policy, not an inventory: don't warn about entries no crate uses yet.
unused-allowed-license = "allow"
exceptions = []

# Our own crates are `publish = false` + `LicenseRef-Proprietary`: skip them.
[licenses.private]
ignore = true
registries = []

# ── Bans ─────────────────────────────────────────────────────────────
[bans]
# Tauri pulls several duplicate versions (windows-sys, bitflags…) that we cannot fix.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    # OpenSSL is never needed: Tauri uses the platform TLS / rustls.
    { crate = "openssl-sys", reason = "use rustls / native platform TLS" },
]
skip = []
skip-tree = []

# ── Sources ──────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
