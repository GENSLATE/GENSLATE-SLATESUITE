[package]
name = "genslate-launcher"
description = "GENSLATE Launcher: the portable, AI-ready app menu of the GENSLATE suite (Tauri 2 shell)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
default-run = "genslate-launcher"

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "genslate_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
genslate-core-launcher.workspace = true
genslate-design-tokens.workspace = true
genslate-paths.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["common-controls-v6", "compression", "dbus", "dynamic-acl", "image-png", "macos-private-api", "tray-icon", "wry", "x11"] }
tauri-plugin-autostart.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-os.workspace = true
tauri-plugin-single-instance.workspace = true
thiserror.workspace = true

[lints]
workspace = true
