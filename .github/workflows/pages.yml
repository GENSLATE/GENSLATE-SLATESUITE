# ──────────────────────────────────────────────────────────────────────
#  GENSLATE — website (GitHub Pages)
#  Builds webapps/genslate-page (every route prerendered) and deploys it.
#  actions/configure-pages reports where Pages serves the site — a project site
#  (https://<owner>.github.io/GENSLATE/) or a custom domain — and the build uses that base.
#  One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# ──────────────────────────────────────────────────────────────────────
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'webapps/genslate-page/**'
      - 'packages/design-system/**'
      - 'packages/tokens/**'
      - 'other/documents/**'
      - 'other/resources/**'
      - 'other/config/appdata/metadata/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_COLOR: '1'

jobs:
  build:
    name: Build website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain (moon · bun · rust from .prototools)
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Test and build (prerender every route)
        env:
          # base_path is "" for a user site or custom domain, "/GENSLATE" for a project site.
          GENSLATE_SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          GENSLATE_SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: bun x moon run genslate-page:typecheck genslate-page:test genslate-page:web-build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: webapps/genslate-page/dist/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
