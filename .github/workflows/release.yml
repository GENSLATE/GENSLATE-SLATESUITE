# ──────────────────────────────────────────────────────────────────────
#  GENSLATE — Release
#  Push a `v*` tag (or run manually) → build the example app for macOS
#  (Apple Silicon + Intel), Windows and Linux with tauri-action and attach
#  the installers to a DRAFT GitHub release. A human publishes the draft.
# ──────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      app:
        description: 'Desktop app to build (folder under desktop/)'
        required: true
        default: 'example'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  APP: ${{ inputs.app || 'example' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write # create the draft release + upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - name: Linux (x64)
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Setup toolchain (moon · bun · rust from .prototools)
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing / notarisation (configure as repository secrets when available):
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID, TAURI_SIGNING_PRIVATE_KEY, …
        with:
          projectPath: desktop/${{ env.APP }}
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('{0}-v__VERSION__', env.APP) }}
          releaseName: 'GENSLATE ${{ env.APP }} v__VERSION__'
          releaseBody: 'Installers for macOS (Apple Silicon + Intel), Windows and Linux. See the assets below.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          retryAttempts: 1
