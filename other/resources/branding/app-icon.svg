<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>GENSLATE</title>
  <defs>
    <!-- Polar Night squircle -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#434c5e"/>
      <stop offset="0.55" stop-color="#3b4252"/>
      <stop offset="1" stop-color="#2e3440"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#88c0d0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#88c0d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="slab-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e222a" flood-opacity="0.45"/>
    </filter>
    <!-- Frost slab faces -->
    <linearGradient id="top-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3d2d0"/>
      <stop offset="1" stop-color="#88c0d0"/>
    </linearGradient>
    <linearGradient id="top-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93b4d4"/>
      <stop offset="1" stop-color="#81a1c1"/>
    </linearGradient>
    <linearGradient id="top-3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f93bd"/>
      <stop offset="1" stop-color="#5e81ac"/>
    </linearGradient>
  </defs>

  <!-- Squircle body (macOS icon grid: 824 × 824 on a 1024 canvas) -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
    <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="url(#rim)" stroke-width="2"/>
  </g>

  <!-- Stack of slates: bottom → top -->
  <g filter="url(#slab-shadow)">
    <!-- bottom slab · nord10 -->
    <path d="M282 595 L512 727 L512 761 L282 629 Z" fill="#4b6a91"/>
    <path d="M512 727 L742 595 L742 629 L512 761 Z" fill="#3f5c80"/>
    <path d="M512 463 L742 595 L512 727 L282 595 Z" fill="url(#top-3)"/>
    <path d="M282 595 L512 463 L742 595" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g filter="url(#slab-shadow)">
    <!-- middle slab · nord9 -->
    <path d="M282 495 L512 627 L512 661 L282 529 Z" fill="#6886a6"/>
    <path d="M512 627 L742 495 L742 529 L512 661 Z" fill="#5a7796"/>
    <path d="M512 363 L742 495 L512 627 L282 495 Z" fill="url(#top-2)"/>
    <path d="M282 495 L512 363 L742 495" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g filter="url(#slab-shadow)">
    <!-- top slab · nord8 → nord7 -->
    <path d="M282 395 L512 527 L512 561 L282 429 Z" fill="#6fa6b6"/>
    <path d="M512 527 L742 395 L742 429 L512 561 Z" fill="#5f95a5"/>
    <path d="M512 263 L742 395 L512 527 L282 395 Z" fill="url(#top-1)"/>
    <path d="M282 395 L512 263 L742 395" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>
