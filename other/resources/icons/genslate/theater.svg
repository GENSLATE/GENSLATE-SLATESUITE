<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>GENSLATE Theater</title>
  <!--
    GENSLATE app icon family: flat Nord plate on the macOS Big Sur icon grid (824 × 824 at
    (100, 100), radius 185 — same as other/resources/branding/app-icon.svg), one glyph colour,
    no gradients. Plate nord12, glyph nord0.
    The launcher crops the viewBox to the plate (100 100 824 824) for list rows.
  -->
  <defs>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#d08770" filter="url(#drop)"/>
  <rect x="290" y="340" width="444" height="344" rx="60" stroke="#2e3440" fill="none" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M474 432l126 80-126 80Z" fill="#2e3440" stroke="#2e3440" stroke-width="28" stroke-linejoin="round"/>
</svg>
