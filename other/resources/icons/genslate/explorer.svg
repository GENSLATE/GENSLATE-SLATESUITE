<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>GENSLATE Explorer</title>
  <!--
    GENSLATE app icon family: flat Nord plate on the macOS Big Sur icon grid (824 × 824 at
    (100, 100), radius 185 — same as other/resources/branding/app-icon.svg), one glyph colour,
    no gradients. Plate nord8, glyph nord0.
    The launcher crops the viewBox to the plate (100 100 824 824) for list rows.
  -->
  <defs>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#88c0d0" filter="url(#drop)"/>
  <path d="M300 372a36 36 0 0 1 36-36h112l44 48h206a36 36 0 0 1 36 36v264a36 36 0 0 1-36 36H336a36 36 0 0 1-36-36Z" fill="#2e3440"/>
  <path d="M300 456h424" stroke="#88c0d0" stroke-width="28"/>
</svg>
