<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>GENSLATE Example</title>
  <!--
    GENSLATE app icon family: flat Nord plate on the macOS Big Sur icon grid (824 × 824 at
    (100, 100), radius 185 — same as other/resources/branding/app-icon.svg), one glyph colour,
    no gradients. Plate nord1, glyph nord7–10.
    The launcher crops the viewBox to the plate (100 100 824 824) for list rows.
  -->
  <defs>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#3b4252" filter="url(#drop)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#434c5e" stroke-width="4"/>
  <rect x="306" y="306" width="190" height="190" rx="44" fill="#88c0d0"/>
  <rect x="528" y="306" width="190" height="190" rx="44" fill="#81a1c1"/>
  <rect x="306" y="528" width="190" height="190" rx="44" fill="#5e81ac"/>
  <rect x="528" y="528" width="190" height="190" rx="95" fill="#8fbcbb"/>
</svg>
