# GENSLATE Explorer — config. Every key is optional; delete a key to get its default.
# Location: <installDir>/other/config/genslate/explorer/config.toml (suite), the same path beside
# the app when run from its own zip, or the repo's other/config in dev. See other/documents/portability.md.

[appearance]
# "system" | "polar-night" | "snow-storm"
theme = "system"

[window]
# Restore window size and position between launches.
remember-state = true

[logging]
# "off" | "error" | "warn" | "info" | "debug" | "trace"
level = "info"

[explorer]
# View for new tabs: "details" | "icons" | "tiles"
view = "details"
# Sort column: "name" | "modified" | "kind" | "size"
sort-by = "name"
sort-descending = false
# Keep folders above files whatever the sort.
folders-first = true
show-hidden = false
# Ask before moving items to the trash (deleting for good always asks).
confirm-trash = false
# Where the first tab opens: "home", "desktop", "documents", "downloads", "pictures", "music",
# "videos", or an absolute path.
start-folder = "home"
# Reopen the last session's tabs.
restore-tabs = true
preview-pane = true
