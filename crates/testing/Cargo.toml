[package]
name = "genslate-testing"
description = "Shared test helpers for GENSLATE crates (temporary file trees, fake repo layouts)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
# `cargo test --workspace` links doctests with every app's build-output folder on the search
# path, and tauri-build puts a stub `msvcrt.lib` there (static CRT), so the doctest cannot link
# on Windows. `tree.rs` and `repo.rs` have unit tests; the lib.rs example is documentation only.
doctest = false

[dependencies]
tempfile.workspace = true

[lints]
workspace = true
