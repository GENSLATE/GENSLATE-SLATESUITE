[package]
name = "genslate-core-launcher"
description = "GENSLATE Launcher logic: config, the app catalog (GENSLATE, PortableApps.com, portapps.io), secure launching, the command registry and system status."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["nvidia"]
# NVIDIA GPU temperature/usage through NVML (loaded at runtime; absent drivers = no GPU readout).
nvidia = ["dep:nvml-wrapper"]

[dependencies]
dunce.workspace = true
genslate-paths.workspace = true
ico.workspace = true
log.workspace = true
notify.workspace = true
nvml-wrapper = { workspace = true, optional = true }
pelite.workspace = true
rust-ini.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true

[dev-dependencies]
genslate-testing.workspace = true

[lints]
workspace = true
